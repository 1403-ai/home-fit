upstream web_upstream {
  server web:4173;
}

upstream api_upstream {
  server api:3000;
}

# 1. HTTP (80 포트) 설정: 도메인으로 들어오는 모든 일반 HTTP 요청을 HTTPS로 강제 전환
server {
  listen 80;
  server_name homefit1403.site www.homefit1403.site;

  # Let's Encrypt 인증서 자동 갱신 및 챌린지를 위한 경로 (보안 유지용)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# 2. HTTPS (443 포트) 설정: 실제 보안 접속이 일어나는 메인 서버 블록
server {
  listen 443 ssl;
  server_name homefit1403.site www.homefit1403.site;

  client_max_body_size 20m;

  # 💡 Let's Encrypt 인증서 파일 경로 세팅
  # (EC2 본체의 /etc/letsencrypt 폴더가 Nginx 컨테이너 내부로 마운트되어 있어야 읽을 수 있습니다.)
  ssl_certificate /etc/letsencrypt/live/homefit1403.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/homefit1403.site/privkey.pem;

  # SSL 최적화 설정 (보안성 향상)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # 백엔드 API 프록시 설정
  location /api/ {
    proxy_pass http://api_upstream/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 프론트엔드 Web(Vite) 프록시 설정
  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}