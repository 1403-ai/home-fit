upstream api_upstream {
  server api:3000;
}

# 1. HTTP (80 포트) 설정: 도메인으로 들어오는 모든 일반 HTTP 요청을 HTTPS로 강제 전환
server {
  listen 80;
  server_name homefit1403.site www.homefit1403.site;

  # Let's Encrypt 인증서 자동 갱신 및 챌린지를 위한 경로 (보안 유지용)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# 2. HTTPS (443 포트) 설정: 실제 보안 접속이 일어나는 메인 서버 블록
server {
  listen 443 ssl;
  server_name homefit1403.site www.homefit1403.site;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20m;

  # 💡 Let's Encrypt 인증서 파일 경로 세팅
  # (EC2 본체의 /etc/letsencrypt 폴더가 Nginx 컨테이너 내부로 마운트되어 있어야 읽을 수 있습니다.)
  ssl_certificate /etc/letsencrypt/live/homefit1403.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/homefit1403.site/privkey.pem;

  # SSL 최적화 설정 (보안성 향상)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # 백엔드 API 프록시 설정 (CORS: localhost 개발 환경 허용)
  location /api/ {
    # Preflight (OPTIONS) 요청 처리
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' $http_origin always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Max-Age' 86400;
      add_header 'Content-Length' 0;
      return 204;
    }

    proxy_pass http://api_upstream/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # NestJS가 보내는 CORS 헤더를 숨기고 nginx에서만 관리 (중복 방지)
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Credentials';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';

    # CORS 응답 헤더 (nginx에서 단일 소스로 관리)
    add_header 'Access-Control-Allow-Origin' $http_origin always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin' always;
  }

  # 정적 asset 캐시 설정
  location /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 프론트엔드 Web(Vite build) 정적 파일 서빙
  location / {
    try_files $uri $uri/ /index.html;
  }
}
