services:
  api:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/home-fit-ai-api:${IMAGE_TAG}
    command: npm run start:prod
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      MONGO_URI: ${MONGO_URI}
      PORT: ${PORT}
    volumes:
      - ./global-bundle.pem:/app/global-bundle.pem:ro
    expose:
      - "3000"

  worker:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/home-fit-ai-api:${IMAGE_TAG}
    command: npm run start:worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      MONGO_URI: ${MONGO_URI}
    volumes:
      - ./global-bundle.pem:/app/global-bundle.pem:ro

  nginx:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/home-fit-ai-nginx:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - api
      - worker
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
