services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: mongod --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/home-fit-ai-api:${IMAGE_TAG}
    command: npm run start:prod
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
      PORT: ${PORT}
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "3000"

  worker:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/home-fit-ai-api:${IMAGE_TAG}
    command: npm run start:worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy

  web:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/home-fit-ai-web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    expose:
      - "4173"

  nginx:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/home-fit-ai-nginx:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - api
      - worker
      - web
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  mongo-data:
