services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/home-fit-ai-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
      PORT: ${PORT}
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "3000"

  web:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/home-fit-ai-web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    expose:
      - "4173"

  nginx:
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/home-fit-ai-nginx:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${NGINX_HTTP_PORT}:80"

volumes:
  mongo-data:
