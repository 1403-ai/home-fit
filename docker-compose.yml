services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: home-fit-ai-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run start:prod
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      MONGO_URI: ${MONGO_URI}
      PORT: ${PORT}
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "3000"

  worker:
    image: home-fit-ai-api:local
    pull_policy: never
    command: npm run start:worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      MONGO_URI: ${MONGO_URI}
    depends_on:
      mongo:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
      - worker
    ports:
      - "${NGINX_HTTP_PORT}:80"

volumes:
  mongo-data:
