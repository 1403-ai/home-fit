name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  # Node.js 20 actions deprecated 경고 해소 (2026-06-02 부터 강제됨)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. GitHub 계정명의 대소문자 이슈를 방지하기 위해 소문자로 변환하여 환경변수에 등록
      - name: Set lower case owner name
        run: |
          echo "IMAGE_OWNER=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/home-fit-ai-api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/home-fit-ai-api:latest

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_API_BASE_URL=/api
            NGINX_CONF=default.prod.conf
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/home-fit-ai-nginx:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/home-fit-ai-nginx:latest

      # 2. EC2에 프로젝트 폴더가 없을 경우를 대비해 폴더 먼저 생성
      - name: Create Target Directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/home-fit-ai

      # 3. 도커 컴포즈 파일 업로드
      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/home-fit-ai"

      # 4. EC2 원격 접속 후 배포 명령어 실행
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_REGISTRY: ${{ env.REGISTRY }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCDB_USERNAME: ${{ secrets.DOCDB_USERNAME }}
          DOCDB_PASSWORD: ${{ secrets.DOCDB_PASSWORD }}
          DOCDB_ENDPOINT: ${{ secrets.DOCDB_ENDPOINT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_REGISTRY,IMAGE_OWNER,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,DOCDB_USERNAME,DOCDB_PASSWORD,DOCDB_ENDPOINT
          script: |
            set -e
            # 신규 EC2 에서도 자동 GHCR 인증 (private 이미지 pull 가능)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/home-fit-ai
            
            # DocumentDB TLS CA 인증서 다운로드
            curl -s https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o global-bundle.pem

            # .env 파일 동적 생성 (DocumentDB 사용)
            cat > .env <<EOF
            NODE_ENV=production
            IMAGE_REGISTRY=$IMAGE_REGISTRY
            IMAGE_OWNER=$IMAGE_OWNER
            IMAGE_TAG=$IMAGE_TAG
            MONGO_URI=mongodb://$DOCDB_USERNAME:$DOCDB_PASSWORD@$DOCDB_ENDPOINT:27017/homefit?tls=true&tlsCAFile=/app/global-bundle.pem&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false&authMechanism=SCRAM-SHA-1
            PORT=3000
            NGINX_HTTP_PORT=80
            EOF

            # 최신 이미지 Pull 및 컨테이너 무중단 재실행 지향
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # 프리티어 용량 관리를 위해 사용하지 않는 이전 이미지 및 빌드 레이어 깨끗하게 정리
            docker image prune -a -f
